version: '3.8'

services:
  # PHP-FPM Service
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: edu_crm_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - /var/www/vendor
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    depends_on:
      - mysql
      - redis
    networks:
      - edu_crm_network

  # Nginx Service
  nginx:
    image: nginx:alpine
    container_name: edu_crm_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - /var/www/vendor
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - edu_crm_network

  # MySQL 8 Service
  mysql:
    image: mysql:8.0
    container_name: edu_crm_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-edu_crm}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_USER: ${DB_USERNAME:-edu_crm_user}
    ports:
      - "3306:3306"
    volumes:
      - crm_mysql_data:/var/lib/mysql
    networks:
      - edu_crm_network

  # Redis Service
  redis:
    image: redis:alpine
    container_name: edu_crm_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - crm_redis_data:/data
    networks:
      - edu_crm_network

  # phpMyAdmin Service
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: edu_crm_phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: ${DB_USERNAME:-edu_crm_user}
      PMA_PASSWORD: ${DB_PASSWORD:-secret}
    depends_on:
      - mysql
    networks:
      - edu_crm_network

  # Queue Worker (Chạy queue sử dụng cùng image PHP)
  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: edu_crm_queue
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan queue:work redis --sleep=3 --tries=3
    volumes:
      - ./:/var/www
      - /var/www/vendor
    depends_on:
      - app
      - redis
      - mysql
    networks:
      - edu_crm_network

networks:
  edu_crm_network:
    driver: bridge

volumes:
  crm_mysql_data:
  crm_redis_data:
